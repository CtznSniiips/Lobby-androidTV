name: Release

# Manually cut a signed release: build the release APK, tag it, and publish a GitHub Release with the APK attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.1.0 (the tag becomes v<version>)"
        required: true
      version_code:
        description: "Android versionCode — leave blank to continue from the Build workflow's run number"
        required: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versionCode
        id: vc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manual="${{ inputs.version_code }}"
          if [ -n "$manual" ]; then
            code="$manual"
            echo "Using the versionCode you entered: $code"
          else
            # The Build workflow stamps each debug build with its run number as the versionCode. Continue that
            # series: take the latest Build run number and step one above it, so a release always outranks the
            # debug builds and climbs with every release.
            base=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=1" --jq '.workflow_runs[0].run_number' 2>/dev/null || echo "")
            if [ -z "$base" ] || [ "$base" = "null" ]; then base=0; fi
            code=$((base + 1))
            echo "Auto versionCode: $code (latest Build run number was $base)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing secret set. A release must be signed so it installs and updates in place."
            echo "Set SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD in the repo secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/lobby.keystore
          cat > keystore.properties <<EOF
          storeFile=app/lobby.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionName=${{ inputs.version }} -PversionCode=${{ steps.vc.outputs.code }} --stacktrace

      - name: Rename APK
        id: apk
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          out=Lobby-TV-${{ inputs.version }}.apk
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
          python3 - <<'PY' > RELEASE_NOTES.md
          import re, pathlib
          version = "${{ inputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text()
          # Prefer a section headed "## [<version>]", else fall back to "## [Unreleased]".
          def section(name):
              m = re.search(r"^## \[" + re.escape(name) + r"\].*?\n(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)", text, re.M | re.S)
              return m.group(1).strip() if m else ""
          notes = section(version) or section("Unreleased") or f"Release {version}."
          print(notes)
          PY
          echo "---- notes ----"; cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "${{ steps.apk.outputs.path }}" \
            --title "Lobby for Android TV v${{ inputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            ${{ inputs.prerelease && '--prerelease' || '' }}
