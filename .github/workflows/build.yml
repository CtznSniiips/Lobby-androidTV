name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secret set; building with the default debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/lobby.keystore
          cat > keystore.properties <<EOF
          storeFile=app/lobby.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble debug APK
        # Stamp an ever-increasing versionCode (the run number) so each CI debug build installs over the last.
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lobby-androidtv-debug
          path: app/build/outputs/apk/debug/*.apk
